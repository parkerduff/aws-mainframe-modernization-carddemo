spring.application.name=carddemo-authorization-fraud

# In-memory H2 stands in for the DB2 AUTHFRDS store; the design stays provider-agnostic (JPA).
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
