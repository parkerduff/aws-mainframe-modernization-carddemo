# Production-style profile: IBM MQ instead of the embedded Artemis broker (BR-10.2),
# and an external relational database instead of H2 (BR-10.1).
#
# Activate with: --spring.profiles.active=ibmmq
spring:
  # Do not start the embedded Artemis broker when using IBM MQ.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jms.artemis.ArtemisAutoConfiguration

  datasource:
    # Example Db2 URL — override via environment/secret in the real deployment.
    url: ${CARDDEMO_DB_URL:jdbc:db2://localhost:50000/CARDDEMO}
    username: ${CARDDEMO_DB_USER:db2inst1}
    password: ${CARDDEMO_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate

# IBM MQ connection (consumed by mq-jms-spring-boot-starter).
ibm:
  mq:
    queue-manager: ${IBM_MQ_QMGR:QM1}
    channel: ${IBM_MQ_CHANNEL:DEV.APP.SVRCONN}
    conn-name: ${IBM_MQ_CONN_NAME:localhost(1414)}
    user: ${IBM_MQ_USER:app}
    password: ${IBM_MQ_PASSWORD:}

