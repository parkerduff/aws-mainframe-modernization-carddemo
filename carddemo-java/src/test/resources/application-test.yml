spring:
  datasource:
    url: jdbc:h2:mem:carddemo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

carddemo:
  jwt:
    secret: Y2FyZGRlbW8tdGVzdC1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtbWUtZm9yLXRlc3RzLTI1Ng==
    expiration-ms: 3600000
