spring:
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  flyway:
    locations: classpath:db/migration

jwt:
  secret: carddemo-local-dev-key-not-for-production-use-must-be-at-least-64-bytes-long-for-hmac512

logging:
  level:
    com.cardemo: DEBUG
    org.springframework.security: DEBUG
