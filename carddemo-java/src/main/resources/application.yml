spring:
  application:
    name: carddemo-java

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${DB_USERNAME:carddemo}
    password: ${DB_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

carddemo:
  jwt:
    # Base64-encoded 256-bit secret. Override in production via CARDDEMO_JWT_SECRET.
    secret: ${CARDDEMO_JWT_SECRET:Y2FyZGRlbW8tZGVmYXVsdC1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMjU2Yml0}
    expiration-ms: ${CARDDEMO_JWT_EXPIRATION_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
