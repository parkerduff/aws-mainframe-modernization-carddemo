# --- Datasource (H2 in-memory for local dev) ---
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate must not create or alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- H2 console (dev convenience) ---
spring.h2.console.enabled=true

# --- One-time fixed-width data loader ---
# Disabled by default; enable with --carddemo.dataload.enabled=true when running the jar.
carddemo.dataload.enabled=false
# Directory containing the fixed-width ASCII sample files (acctdata.txt, cardxref.txt, tcatbal.txt, dailytran.txt).
carddemo.dataload.path=../app/data/ASCII
